<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skincare Heaven</title>
  <style>
    /* Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background-color: #f5e6d9;
      color: #333;
      line-height: 1.6;
    }

    .navbar {
      background-color: #bf8f5c;
      color: white;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 1rem 0;
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 10;
    }

    .navbar a {
      color: white;
      text-decoration: none;
      font-size: 1.1rem;
      transition: color 0.3s ease;
      padding: 0.5rem 1rem;
    }

    .navbar a:hover {
      color: #d2a679;
      border-bottom: 2px solid #d2a679;
    }

    .header {
      position: relative;
      height: 80vh;
      margin-top: 60px;
      overflow: hidden;
    }

    .slider {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .slider-container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .slider img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      opacity: 0;
      transition: opacity 1s ease-in-out;
    }

    .slider img.active {
      opacity: 1;
    }

   
    .slider-text {
      position: absolute;
      top: 50%;
      left: 5%;
      transform: translateY(-50%);
      color: black;
      font-size: 2rem;
      max-width: 40%;
      z-index: 5;
    }

    .section {
      max-width: 1200px;
      margin: 3rem auto;
      padding: 2rem;
      text-align: center;
      background: white;
      border-radius: 10px;
      box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
    }

    .shop-goals {
      margin-top: 2rem;
      padding: 3rem 2rem;
    }

    .goals button {
      margin: 10px;
      padding: 10px 20px;
      font-size: 1rem;
      background: #bf8f5c;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s ease;
    }

    .goals button:hover {
      background: #d2a679;
    }

    .shop-goals .button {
      display: inline-block;
      background: #bf8f5c;
      color: white;
      padding: 12px 20px;
      text-decoration: none;
      border-radius: 5px;
      margin-top: 20px;
      transition: 0.3s ease;
    }

    .shop-goals .button:hover {
      background: #d2a679;
    }

  
    .footer {
      background-color: #333;
      color: white;
      text-align: center;
      padding: 1.5rem 1rem;
      margin-top: 3rem;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="index.html">Ballina</a>
    <a href="about.html">Rreth Nesh</a>
    <a href="products.html">Produktet</a>
    <a href="register.html">Regjistrohu</a>
    <a href="login.html">Login</a>
  </nav>

  <div class="header">
    <div class="slider">
      <div class="slider-container">
        <img src="images.jpg" alt="Slider Image 1">
        <img src="pp8.jpg" alt="Slider Image 2">
        <img src="database\uploads\niacinamideserum.jpg" alt="Slider Image 3">
      </div>
      <div class="slider-text">
        <h1>Skincare Heaven</h1>
        <p>Parajsa për Lëkurën Tuaj</p>
      </div>
    </div>
  </div>

  <section class="section shop-goals">
    <h2>Bli sipas asaj që lëkura juaj ka nevojë</h2>
    <div class="goals">
      <button>Ndriçim</button>
      <button>Rigjenerim</button>
      <button>Kundër Plakjes</button>
      <button>Hidratim i Thellë</button>
    </div>
    <a href="products.html" class="button">Bli Tani</a>
  </section>

  <script>
    let currentIndex = 0;
    const slides = document.querySelectorAll('.slider img');
    const totalSlides = slides.length;

    function changeSlide() {
      slides[currentIndex].classList.remove('active');
      currentIndex = (currentIndex + 1) % totalSlides;
      slides[currentIndex].classList.add('active');
    }

    setInterval(changeSlide, 3000);
  </script>

  <footer class="footer">
    <p>&copy; 2024 Skincare Heaven. Të gjitha të drejtat janë të rezervuara.</p>
  </footer>
</body>
</html>
