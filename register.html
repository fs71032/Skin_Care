<body>

  <nav class="navbar">
    <a href="index.html">Ballina</a>
    <a href="about.html">Rreth Nesh</a>
    <a href="products.html">Produktet</a>
    <a href="register.html">Regjistrohu</a>
    <a href="login.html">Login</a>
    <div class="hamburger" onclick="toggleMenu()">
      <div></div>
      <div></div>
      <div></div>
    </div>
  </nav>

  <div class="registration-container">
    <h2>Regjistrohu në Skincare Heaven</h2>

    <form id="registration-form" action="database/register_user.php" method="POST">
    <form id="registration-form" action="database/register_user.php" method="POST">
      <div class="form-group">
        <label for="name">Emri</label>
        <input type="text" id="name" name="name" required>
        <p class="error" id="name-error"></p>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
        <p class="error" id="email-error"></p>
      </div>

      <div class="form-group">
        <label for="password">Fjalëkalimi</label>
        <input type="password" id="password" name="password" required>
        <p class="error" id="password-error"></p>
      </div>

      <div class="form-group">
        <label for="confirm-password">Konfirmo Fjalëkalimin</label>
        <input type="password" id="confirm-password" name="confirm-password" required>
        <p class="error" id="confirm-password-error"></p>
      </div>

      <button type="submit">Regjistrohu</button>
    </form>
  </div>

  <footer class="footer">

  </footer>

  <script src="register.js"></script>
</body>
