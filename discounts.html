<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zbritjet</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f5e6d9;
      color: #333;
      line-height: 1.6;
    }

    .navbar {
      background-color: #bf8f5c;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      flex-wrap: wrap;
    }

    .navbar a {
      color: white;
      text-decoration: none;
      margin: 0 1rem;
      font-size: 1rem;
      transition: color 0.3s ease;
    }

    .navbar a:hover {
      color: #d2a679;
    }

    .header {
      position: relative;
      height: 50vh;
      background: url('https://www.ravalmd.com/hs-fs/hubfs/AdobeStock_276306017%20(1).jpeg?width=3285&height=2190&name=AdobeStock_276306017%20(1).jpeg') no-repeat center center/cover;
      background-size: cover;
    }

    .header-content {
      position: absolute;
      top: 50%;
      right: 10%;
      transform: translateY(-50%);
      text-align: right;
      color: black;
    }

    .header h1 {
      font-size: 3rem;
      margin: 0;
      font-weight: bold;
    }

    .header p {
      font-size: 1.5rem;
      margin: 0.5rem 0 0;
      font-weight: bold;
    }

    .slider {
      width: 80%;
      max-width: 600px;
      margin: auto;
      position: relative;
      overflow: hidden;
      border-radius: 10px;
    }

    .slides {
      display: flex;
      transition: transform 1s ease-in-out;
    }

    .slide {
      width: 100%;
      height: 300px;
      object-fit: cover;
      position: relative;
    }

    .caption {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background-color: rgba(0, 0, 0, 0.5);
      color: white;
      padding: 10px;
      font-size: 1.5rem;
      font-weight: bold;
      border-radius: 5px;
    }

    .prev, .next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background-color: rgba(0, 0, 0, 0.5);
      color: white;
      border: none;
      padding: 10px;
      cursor: pointer;
      font-size: 20px;
    }

    .prev {
      left: 10px;
    }

    .next {
      right: 10px;
    }

    .prev:hover, .next:hover {
      background-color: rgba(0, 0, 0, 0.8);
    }

    .discounts-message {
      text-align: center;
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: #bf8f5c;
      font-weight: bold;
    }

    /* Responsive styles */
    @media (max-width: 1024px) {
      .navbar {
        flex-direction: column;
        align-items: center;
      }

      .header h1 {
        font-size: 2.5rem;
      }

      .header p {
        font-size: 1.3rem;
      }

      .slider {
        width: 90%;
        max-width: 500px;
      }

      .caption {
        font-size: 1.2rem;
      }
    }

    @media (max-width: 768px) {
      .header h1 {
        font-size: 2rem;
      }

      .header p {
        font-size: 1.1rem;
      }

      .slider {
        width: 100%;
        max-width: 400px;
      }

      .caption {
        font-size: 1rem;
      }

      .discounts-message {
        font-size: 1.2rem;
      }
    }

    @media (max-width: 480px) {
      .header {
        height: 40vh;
      }

      .header h1 {
        font-size: 1.8rem;
      }

      .header p {
        font-size: 1rem;
      }

      .slider {
        width: 100%;
        max-width: 350px;
      }

      .caption {
        font-size: 0.9rem;
      }

      .discounts-message {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="index.html">Homepage</a>
    <a href="about.html">Rreth Nesh</a>
    <a href="products.html">Produktet</a>
    <a href="discounts.html">Zbritjet</a>
    <a href="register.html">Regjistrohu</a>
    <a href="login.html">Login</a>
  </nav>

  <header class="header">
    <div class="header-content">
      <h1>Skincare Heaven</h1>
      <p>Parajsa për Lëkurën Tuaj</p>
    </div>
  </header>

  <div class="discounts-message">
    <p>Këtu gjeni zbritjet aktuale! Nxitoni të merrni produktet tuaja të preferuara me ofertat më të volitshme ndonjëherë!</p>
  </div>

  <div class="slider">
    <div class="slides">
      <div class="slide">
        <img src="spf.jpg" alt="Produkt 1">
        <div class="caption">25% Zbritje</div>
      </div>
      
      <div class="slide">
        <img src="niacinamideserum.jpg" alt="Produkt 2">
        <div class="caption">25% Zbritje</div>
      </div>
      
      <div class="slide">
        <img src="facesrrub.jpg" alt="Produkt 3">
        <div class="caption">25% Zbritje</div>
      </div>
      
      <div class="slide">
        <img src="moisturizer.jpg" alt="Produkt 4">
        <div class="caption">20% Zbritje</div>
      </div>
      
      <div class="slide">
        <img src="cleanser(2).jpg" alt="Produkt 5">
        <div class="caption">20% Zbritje</div>
      </div>
    </div>
    <button class="prev" onclick="moveSlide(-1)">&#10094;</button>
    <button class="next" onclick="moveSlide(1)">&#10095;</button>
  </div>

  <script>
    let slideIndex = 0;

    function moveSlide(step) {
      const slides = document.querySelectorAll(".slide");
      slideIndex += step;

      if (slideIndex < 0) {
        slideIndex = slides.length - 1;
      }
      if (slideIndex >= slides.length) {
        slideIndex = 0;
      }

      const slidesContainer = document.querySelector(".slides");
      slidesContainer.style.transform = `translateX(${-slideIndex * 100}%)`;
    }
  </script>

</body>
</html>
